# Configuration de l'application
spring.application.name=gestion-hopital
server.port=8080

# Configuration de la base de données PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/hospital
spring.datasource.username=postgres
spring.datasource.password=Marvic&21
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuration JPA/Hibernate
spring.jpa.database=POSTGRESQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.generate_statistics=true

# Configuration de la sécurité
spring.security.filter.order=10

# Configuration JWT
jwt.secret=Marvic&21
jwt.expiration=86400000

Configuration CORS - désactivée car gérée par CorsConfig.java
spring.mvc.cors.allowed-origins=*
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*
spring.mvc.cors.allow-credentials=false

# Configuration Orthanc (serveur DICOM)
storage.orthanc-url=http://localhost:8042
storage.orthanc-username=orthanc
storage.orthanc-password=orthanc

# Configuration pour le téléchargement de fichiers
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB

# Configuration Jackson pour gérer les références circulaires
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Configuration du stockage des images médicales
# Utilisation d'un chemin relatif par rapport au répertoire d'exécution (user.dir)
storage.base-path=medical-images
# Sous-répertoires pour les différents types d'images
storage.scanner-path=${storage.base-path}/scanner
storage.radiography-path=${storage.base-path}/radiographie
storage.mri-path=${storage.base-path}/irm
storage.ultrasound-path=${storage.base-path}/echographie
storage.mammography-path=${storage.base-path}/mammographie
storage.angiography-path=${storage.base-path}/angiographie
storage.other-path=${storage.base-path}/autre

# Configuration Orthanc pour les images DICOM
storage.orthanc-url=http://localhost:8042
storage.orthanc-username=orthanc
storage.orthanc-password=orthanc

# Configuration pour l'upload de fichiers
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Configuration Jackson supplémentaire
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.deserialization.accept-single-value-as-array=true
